services:
  app:
    image: love-in-a-spin:shared
    build:
      context: ..
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ALLOWED_ORIGINS: https://csyupup.github.io
      ALLOW_ROOM_CREATION: "false"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
