limit_req_zone $binary_remote_addr zone=love_api:10m rate=10r/s;
server {
    listen 443 ssl;
    server_name 203.195.205.39;
    ssl_certificate /etc/letsencrypt/live/203.195.205.39/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.195.205.39/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location /api/ {
        limit_req zone=love_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
    location = /health { proxy_pass http://127.0.0.1:3000; }
    location / { return 404; }
}
